[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-company"
version = "0.1.0"
description = "Budget-controlled project orchestration foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-company = "ai_company.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
