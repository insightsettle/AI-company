name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ai-company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test runner
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Check safe status command
        run: ai-company --db /tmp/ai-company-ci.sqlite3 status
